services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: rauf-backend

    working_dir: /app

    command: daphne -b 0.0.0.0 -p 8000 backend.config.asgi:application

    volumes:
      - .:/app

    env_file:
      - .env

    environment:
      - DJANGO_SETTINGS_MODULE=backend.config.settings
      - PYTHONPATH=/app/backend

    depends_on:
      - redis

    networks:
      - appnet

  nginx:
    image: nginx:latest
    container_name: rauf-nginx
    ports:
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./docker/certs:/etc/nginx/certs

    depends_on:
      - backend

    networks:
      - appnet

  redis:
    image: redis:alpine
    container_name: rauf-redis
    ports:
      - "6379:6379"
    networks:
      - appnet

networks:
  appnet:
